const MONTHS = {jan:"01",feb:"02",mar:"03",apr:"04",may:"05",jun:"06",jul:"07",aug:"08",sep:"09",oct:"10",nov:"11",dec:"12"};
function toMMYYYY(dateStr) {
  const trimmed = String(dateStr).trim();
  const monthYear = trimmed.match(/^([A-Za-z]{3,})\s+(\d{4})$/);
  if (monthYear) {
    const mm = MONTHS[monthYear[1].slice(0, 3).toLowerCase()];
    if (mm) return `${mm}/${monthYear[2]}`;
  }
  const yearOnly = trimmed.match(/^(\d{4})$/);
  if (yearOnly) return `01/${yearOnly[1]}`;
  return trimmed;
}

function copyText(text, feedbackEl) {
  const done = () => {
    if (!feedbackEl) return;
    feedbackEl.classList.add("copied");
    const prevText = feedbackEl.dataset.origText;
    if (feedbackEl.tagName === "BUTTON" && prevText === undefined) {
      feedbackEl.dataset.origText = feedbackEl.textContent;
      feedbackEl.textContent = "Copied";
    }
    showToast("Copied to clipboard");
    setTimeout(() => {
      feedbackEl.classList.remove("copied");
      if (feedbackEl.dataset.origText !== undefined) {
        feedbackEl.textContent = feedbackEl.dataset.origText;
      }
    }, 1100);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { /* ignore */ }
  document.body.removeChild(ta);
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1200);
}

function fieldRow(label, value, copyValue) {
  const row = document.createElement("div");
  row.className = "field-row";
  const lab = document.createElement("div");
  lab.className = "field-label";
  lab.textContent = label;
  const val = document.createElement("div");
  val.className = "field-value";
  val.textContent = value;
  const btn = document.createElement("button");
  btn.className = "copy-btn";
  btn.textContent = "Copy";
  const toCopy = copyValue !== undefined ? copyValue : value;
  btn.addEventListener("click", () => copyText(toCopy, btn));
  row.appendChild(lab);
  row.appendChild(val);
  row.appendChild(btn);
  return row;
}

function dateSubRow(label, value) {
  const row = document.createElement("div");
  row.className = "field-row";
  const lab = document.createElement("div");
  lab.className = "field-label";
  lab.textContent = label;
  const val = document.createElement("div");
  val.className = "field-value";
  val.textContent = value;
  const btn = document.createElement("button");
  btn.className = "copy-btn";
  btn.textContent = "Copy";
  btn.addEventListener("click", () => copyText(toMMYYYY(value), btn));
  row.appendChild(lab);
  row.appendChild(val);
  row.appendChild(btn);
  return row;
}

function dateRow(start, end) {
  const frag = document.createDocumentFragment();
  frag.appendChild(dateSubRow("Start Date", start));
  frag.appendChild(dateSubRow("End Date", end));
  return frag;
}

    card.appendChild(fieldRow("Location", job.location));
    card.appendChild(dateRow(job.start, job.end));
    const description = job.bullets.map(b => `• ${b}`).join("\n");
    card.appendChild(fieldRow("Description", description));
    container.appendChild(card);
  });
}

function repoRow(url) {
  const row = document.createElement("div");
  row.className = "field-row";
  const lab = document.createElement("div");
  lab.className = "field-label";
  lab.textContent = "GitHub";
  row.appendChild(lab);

  if (!url) {
    const val = document.createElement("div");
    val.className = "field-value no-repo";
    val.textContent = "No public repo";
    row.appendChild(val);
    return row;
  }

  const link = document.createElement("a");
  link.className = "field-value repo-link";
  link.href = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = url;
  const btn = document.createElement("button");
  btn.className = "copy-btn";
  btn.textContent = "Copy";
  btn.addEventListener("click", () => copyText(url, btn));
  row.appendChild(link);
  row.appendChild(btn);
  return row;
}

function renderProjects() {
  const container = document.getElementById("projects");
  DATA.projects.forEach((proj, i) => {
    const card = document.createElement("div");
    card.className = "card";
    const title = document.createElement("div");
    title.className = "card-title";
    const rank = document.createElement("span");
    rank.className = "rank";
    rank.textContent = i + 1;
    title.appendChild(rank);
    title.appendChild(document.createTextNode(proj.name));
    card.appendChild(title);
    card.appendChild(fieldRow("Project", proj.name));
    if (proj.date) card.appendChild(fieldRow("Date", proj.date, toMMYYYY(proj.date)));
    card.appendChild(repoRow(proj.url));
    const description = proj.bullets.map(b => `• ${b}`).join("\n");
    card.appendChild(fieldRow("Description", description));
    container.appendChild(card);
  });
}

function renderEducation() {
  const container = document.getElementById("education");
  DATA.education.forEach(ed => {
    const card = document.createElement("div");
    card.className = "card";
    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = `${ed.degree} — ${ed.school}`;
    card.appendChild(title);
    card.appendChild(fieldRow("Degree", ed.degreeField || ed.degree));
    card.appendChild(fieldRow("School", ed.school));
    card.appendChild(fieldRow("Location", ed.location));
    card.appendChild(dateRow(ed.start, ed.end));
    card.appendChild(fieldRow("GPA", ed.gpa));
    card.appendChild(fieldRow("Coursework", ed.courses.join(", ")));
    container.appendChild(card);
  });
}

function renderSkills() {
  const container = document.getElementById("skills");
  Object.entries(DATA.skills).forEach(([category, items]) => {
    const block = document.createElement("div");
    block.className = "skills-block";
    const h3 = document.createElement("h3");
    h3.textContent = category;
    block.appendChild(h3);
    const row = document.createElement("div");
    row.className = "chip-row";
    items.forEach(skill => {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = skill;
      chip.addEventListener("click", () => copyText(skill, chip));
      row.appendChild(chip);
    });
    block.appendChild(row);
    container.appendChild(block);
  });
}

renderExperience();
renderProjects();
renderEducation();
renderSkills();
</script>
</body>
</html>
